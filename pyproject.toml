[project]
name = "syncly"
version = "0.1.0"
description = "REST API and Telegram bot for work schedules"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic>=2.14.3",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = 'py312'
line-length = 88

[tool.ruff.lint]
select = ['E', 'F', 'I']
ignore = ['E501']

[tool.ruff.format]
quote-style = 'single'
